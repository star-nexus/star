[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "star-native"
version = "0.1.0"
requires-python = ">=3.13"
description = "STAR Rust simulation kernel and Python bindings"

[tool.maturin]
python-source = "python"
module-name = "star_native._native"
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.uv]
# Include the ENV kernel and framework: cached bindings must match both layers.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "python/**/*.py" },
    { file = "../rotk/Cargo.toml" },
    { file = "../rotk/src/**/*.rs" },
    { file = "../../../framework/native/Cargo.toml" },
    { file = "../../../framework/native/src/**/*.rs" },
    { file = "../../../Cargo.toml" },
    { file = "../../../Cargo.lock" },
]
