[workspace]
members = ["native/core", "native/rotk", "native/python"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"

[workspace.dependencies]
bevy_ecs = { version = "=0.19.1", default-features = false, features = ["std", "multi_threaded"] }
pyo3 = { version = "=0.29.2", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "arbitrary_precision"] }
blake2 = "0.10"
num-bigint = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
# Keep unwind: a poisoned native instance must fail instead of killing Python.
panic = "unwind"
