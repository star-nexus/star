name: starbench
x-build: &build
  context: ../..
  dockerfile: deploy/arena/Dockerfile
  args:
    PYTHON_IMAGE: ${PYTHON_IMAGE:?images.lock required}
    NODE_IMAGE: ${NODE_IMAGE:?images.lock required}
    RUST_IMAGE: ${RUST_IMAGE:?images.lock required}
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'
services:
  caddy:
    image: ${CADDY_IMAGE:?}
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    volumes: ['./generated/Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy-data:/data', 'caddy-config:/config']
    networks: [edge]
    logging: *logging
  postgres:
    image: ${POSTGRES_IMAGE:?}
    restart: unless-stopped
    volumes: ['postgres-data:/var/lib/postgresql/data', './init-db.sh:/docker-entrypoint-initdb.d/10-arena.sh:ro']
    networks: [private]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
  keycloak:
    image: ${KEYCLOAK_IMAGE:?}
    command: ['start', '--import-realm']
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    volumes: ['./generated/realm.json:/opt/keycloak/data/import/starbench-realm.json:ro']
    networks: [edge, private]
    healthcheck:
      test: ['CMD', '/bin/bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3; read -r status <&3; [[ "$$status" == *" 200 "* ]]']
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *logging
  hub:
    build:
      <<: *build
      target: hub
    restart: unless-stopped
    networks: [private]
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
  arena:
    build:
      <<: *build
      target: runtime
    # One gateway per database. Match workers are independent child processes.
    init: true
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      hub: {condition: service_healthy}
    volumes: ['arena-logs:/app/.arena']
    networks: [edge, private]
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8780/health", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
networks:
  edge: {}
  private: {internal: true}
volumes:
  postgres-data: {}
  caddy-data: {}
  caddy-config: {}
  arena-logs: {}
